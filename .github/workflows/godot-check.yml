name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-smoke-test:
    # Pin a known hosted image instead of ubuntu-latest to avoid image-rollout changes.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Start main scene
        run: godot --headless --path . --quit-after 5
