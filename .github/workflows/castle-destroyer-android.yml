name: Castle Destroyer Android

on:
  push:
    branches: [main, castle-destroyer-android, castle-destroyer-expansion]
    paths:
      - 'CastleDestroyer/**'
      - '.github/workflows/castle-destroyer-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CastleDestroyer/**'
      - '.github/workflows/castle-destroyer-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Install matching Godot export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          printf '4.4.1.stable' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CastleDestroyer/export_presets.cfg")
          s = p.read_text()
          marker = "[preset.0.options]\n"
          assert s.count(marker) == 1, "Expected exactly one Android export options section"
          signing = (
              'keystore/debug="' + str(Path(__import__("os").environ["RUNNER_TEMP"]) / "debug.keystore") + '"\n'
              'keystore/debug_user="androiddebugkey"\n'
              'keystore/debug_password="android"\n'
          )
          p.write_text(s.replace(marker, marker + signing))
          PY
          test -s "$RUNNER_TEMP/debug.keystore"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
      - name: Download and stage Kenney CC0 assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kenney/source"
          curl --location --fail --retry 3 --retry-delay 2 --user-agent "CastleDestroyer-CI/1.0" \
            --output "$RUNNER_TEMP/kenney/kenney_castle-kit.zip" \
            https://opengameart.org/sites/default/files/kenney_castle-kit.zip
          curl --location --fail --retry 3 --retry-delay 2 --user-agent "CastleDestroyer-CI/1.0" \
            --output "$RUNNER_TEMP/kenney/kenney_ui-pack.zip" \
            https://opengameart.org/sites/default/files/kenney_ui-pack.zip
          curl --location --fail --retry 3 --retry-delay 2 --user-agent "CastleDestroyer-CI/1.0" \
            --output "$RUNNER_TEMP/kenney/kenney_retro-medieval-kit.zip" \
            https://opengameart.org/sites/default/files/kenney_retro-medieval-kit.zip
          echo "921f3f73927bb23106cae34bc21d5ab4b033a9fc120475e96f714a406e3169df  $RUNNER_TEMP/kenney/kenney_castle-kit.zip" | sha256sum --check
          echo "a8a14a234911eb648c062622915c93e79e94e97cb7f9f375a70f6617f1174318  $RUNNER_TEMP/kenney/kenney_ui-pack.zip" | sha256sum --check
          echo "3575369035274195de8e0174046886b50930279e0944a313990a4c2524745960  $RUNNER_TEMP/kenney/kenney_retro-medieval-kit.zip" | sha256sum --check
          python3 CastleDestroyer/tools/import_kenney_assets.py castle "$RUNNER_TEMP/kenney/kenney_castle-kit.zip" --destination-root "$RUNNER_TEMP/kenney/source"
          python3 CastleDestroyer/tools/import_kenney_assets.py ui "$RUNNER_TEMP/kenney/kenney_ui-pack.zip" --destination-root "$RUNNER_TEMP/kenney/source"
          python3 CastleDestroyer/tools/import_kenney_assets.py retro "$RUNNER_TEMP/kenney/kenney_retro-medieval-kit.zip" --destination-root "$RUNNER_TEMP/kenney/source"
          python3 CastleDestroyer/tools/stage_kenney_runtime.py "$RUNNER_TEMP/kenney/source/kenney-castle-kit" "$RUNNER_TEMP/kenney/source/kenney-ui-pack" "$RUNNER_TEMP/kenney/source/kenney-retro-medieval-kit"
          test -s CastleDestroyer/assets/vendor/kenney-runtime/models/wall.glb
          test -s CastleDestroyer/assets/vendor/kenney-runtime/models/retro/wall-fortified.glb
          test -s CastleDestroyer/assets/vendor/kenney-runtime/models/retro/Textures/cobblestone.png
          test -s CastleDestroyer/assets/vendor/kenney-runtime/ui/button_rectangle_depth_flat.png
          test ! -d CastleDestroyer/assets/vendor/kenney-castle-kit
          test ! -d CastleDestroyer/assets/vendor/kenney-ui-pack
      - name: Stage lightweight Gobkit animated insects
        run: |
          set -euo pipefail
          python3 CastleDestroyer/tools/stage_gobkit_runtime.py CastleDestroyer/assets/vendor/gobkit-insect001-pack.zip --destination CastleDestroyer/assets/vendor/gobkit-runtime --max-models 2
          test "$(find CastleDestroyer/assets/vendor/gobkit-runtime -maxdepth 1 -name '*.glb' | wc -l)" -ge 1
          python3 -m unittest discover -s CastleDestroyer/tests -p 'gobkit_runtime_test.py' -v
      - name: Test Kenney runtime staging
        run: python3 -m unittest discover -s CastleDestroyer/tests -p 'kenney_runtime_test.py' -v
      - name: Test asset importer safety
        run: python3 -m unittest discover -s CastleDestroyer/tests -p 'asset_importer_test.py' -v
      - name: Import and validate game with a real OpenGL context
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --editor --path CastleDestroyer --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "Can't open file|Error importing|Failed loading resource|Parameter \\"t\\" is null" "$RUNNER_TEMP/godot-import.log"; then
            echo "Godot reported a missing asset or texture import error."
            exit 1
          fi
      - name: Strict GDScript parse check
        run: godot --headless --path CastleDestroyer --check-only --script res://scripts/game.gd
      - name: Strict camera preview script parse check
        run: godot --headless --path CastleDestroyer --check-only --script res://scripts/camera_a_preview.gd
      - name: Run camera A preview smoke test
        run: godot --headless --path CastleDestroyer res://scenes/camera_a_preview.tscn --quit-after 2
      - name: Test main 3D battlefield integration
        run: godot --headless --path CastleDestroyer --script res://tests/main_3d_battlefield_test.gd
      - name: Test structural integrity graph
        run: godot --headless --path CastleDestroyer --script res://tests/structural_integrity_test.gd
      - name: Test Jolt debris simulation
        run: godot --headless --path CastleDestroyer --script res://tests/jolt_debris_test.gd
      - name: Run headless game smoke test
        run: godot --headless --path CastleDestroyer --quit-after 5
      - name: Export debug APK
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path CastleDestroyer --export-debug "Android" "$GITHUB_WORKSPACE/build/CastleDestroyer-debug.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/android-export.log"
          test -s "$GITHUB_WORKSPACE/build/CastleDestroyer-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CastleDestroyer-Android-debug
          path: |
            build/CastleDestroyer-debug.apk
            build/android-export.log
          if-no-files-found: error
          retention-days: 14
