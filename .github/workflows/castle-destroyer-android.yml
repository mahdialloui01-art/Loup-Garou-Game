name: Castle Destroyer Android

on:
  push:
    branches: [main, castle-destroyer-android]
    paths:
      - 'CastleDestroyer/**'
      - '.github/workflows/castle-destroyer-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CastleDestroyer/**'
      - '.github/workflows/castle-destroyer-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Install matching Godot export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          printf '4.4.1.stable' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import and validate game
        run: godot --headless --editor --path CastleDestroyer --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path CastleDestroyer --export-debug "Android" build/CastleDestroyer-debug.apk
          test -s build/CastleDestroyer-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CastleDestroyer-Android-debug
          path: build/CastleDestroyer-debug.apk
          if-no-files-found: error
          retention-days: 14
